<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Howl direction B: Roll Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="b.css">
</head>
<body>
  <div class="shell">
    <header class="side">
      <a class="wordmark" href="#" aria-label="Howl home">Howl</a>
      <nav aria-label="Main">
        <a class="nav-link" href="#" aria-current="page"><span data-icon="home"></span>Home</a>
        <a class="nav-link" href="#"><span data-icon="places"></span>Places</a>
        <a class="nav-link" href="#"><span data-icon="alerts"></span>Alerts</a>
        <a class="nav-link" href="#"><span data-icon="profile"></span>Profile</a>
      </nav>
      <button class="btn" type="button">Howl</button>
    </header>

    <main class="main">
      <div class="top">
        <a class="wordmark phone-only" href="#" aria-label="Howl home">Howl</a>
        <div class="circles phone-only" data-places="circles" role="group" aria-label="Filter by place"></div>
        <div class="tabs" role="group" aria-label="Order posts">
          <button type="button" data-sort="latest" aria-pressed="true">Latest</button>
          <button type="button" data-sort="loudest" aria-pressed="false">Loudest</button>
        </div>
      </div>
      <p class="sr-only" role="status" data-status></p>
      <div class="feed" data-feed></div>
    </main>

    <aside class="extras" aria-label="Places">
      <h2>Places</h2>
      <div data-places="list" role="group" aria-label="Filter by place"></div>
    </aside>
  </div>

  <nav class="bottom-nav phone-only" aria-label="Main">
    <a href="#" aria-label="Home" aria-current="page"><span data-icon="home"></span></a>
    <a href="#" aria-label="Places"><span data-icon="places"></span></a>
    <button class="btn-round" type="button" aria-label="Write a Howl"><span data-icon="pen"></span></button>
    <a href="#" aria-label="Alerts"><span data-icon="alerts"></span></a>
    <a href="#" aria-label="Profile"><span data-icon="profile"></span></a>
  </nav>

  <script src="data.js"></script>
  <script src="feed.js"></script>
  <script src="b.js"></script>
</body>
</html>
